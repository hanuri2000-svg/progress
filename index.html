<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#173b6d">
  <title>HSBMA 작업 진행 현황</title>
  <script>
    (()=>{const u=new URL(location.href),stamp=Number(u.searchParams.get('fresh'))||0;if(Date.now()-stamp>30000){u.searchParams.set('fresh',Date.now());location.replace(u.href)}})();
  </script>
  <style>
    :root{--navy:#173b6d;--navy2:#254f83;--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#c8d0dc;--strong:#6f7d91;--soft:#eaf0f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
    header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:max(18px,env(safe-area-inset-top)) 18px 18px}header h1{font-size:20px;margin:0 0 4px}header p{margin:0;opacity:.8;font-size:13px}
    main{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:0;padding:11px 15px;border-radius:10px;background:#dfe5ee;color:#526075;font-weight:700}.tab.active{background:var(--navy);color:#fff}
    .panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid #dbe1ea;border-radius:14px;padding:15px;box-shadow:0 6px 20px rgba(26,39,64,.06)}
    .home{max-width:620px;margin:9vh auto 0;text-align:center}.home h2{margin:4px 0 8px;color:var(--navy)}.home p{margin:0 0 22px;color:var(--muted)}.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.project-btn{border:2px solid #d8e1ec;border-radius:14px;padding:26px 14px;background:#fff;color:var(--navy);font-size:19px;font-weight:900;box-shadow:0 6px 18px rgba(26,39,64,.06)}.project-btn:active{background:var(--soft)}.app-view{display:none}
    .filters{display:flex;align-items:end;justify-content:space-between;gap:12px;min-width:0;margin-bottom:14px}.field{display:grid;min-width:0;gap:6px;font-size:13px;color:var(--muted)}input[type=date]{display:block;width:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--text);font-weight:700}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse}th,td{text-align:center;padding:10px 7px;border-bottom:1px solid var(--line);font-size:13px}thead th{background:var(--soft);font-weight:800}thead .group{background:#dbe7f4;color:#173b6d}tbody tr:last-child td{border-bottom:0}tbody td+td{border-left:1px solid var(--line)}td:first-child{font-weight:800;white-space:nowrap}.group-start{border-left:3px solid var(--strong)!important}.pct{width:76px;border:1px solid #bdc7d4;border-radius:8px;padding:9px 5px;text-align:right;font-size:16px}.avg{font-weight:800;color:var(--navy)}
    .buttons{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 15px;background:#dfe5ee;color:#344054;font-weight:800}.btn.primary{background:var(--navy);color:#fff}.btn.danger{background:#fee4e2;color:#b42318}.status{font-size:13px;color:var(--muted);margin-right:auto;align-self:center}
    .report{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.report-title{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:11px}.report-title h2{margin:0;color:var(--navy);font-size:20px}.report-date{color:var(--muted);font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}.kpi{background:var(--soft);padding:12px;border-radius:10px;text-align:center;color:var(--muted);font-size:12px}.kpi b{display:block;margin-top:3px;color:var(--navy);font-size:21px}.share-note{color:var(--muted);text-align:center;padding:14px}.version{text-align:center;color:#98a2b3;font-size:11px;padding:16px}
    @media(max-width:700px){
      main{padding:10px}.card{padding:11px}.home{margin-top:7vh}.project-grid{grid-template-columns:1fr}.filters{width:100%;align-items:stretch;flex-direction:column}.field,input[type=date]{width:100%;min-width:0;max-width:100%}.buttons .btn{flex:1}.status{width:100%;margin:0 0 2px}.kpi{padding:9px 4px}.kpi b{font-size:18px}.report{padding:12px}.report-title{align-items:flex-start;flex-direction:column;gap:5px}
      .table-wrap{overflow:visible;border:0;border-radius:0;background:transparent}.table-wrap table{min-width:0;border-collapse:separate;border-spacing:0}.table-wrap thead{display:none}.table-wrap tbody{display:grid;gap:12px}.table-wrap tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(26,39,64,.05)}
      .table-wrap tbody td{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border:0!important;font-size:13px}.table-wrap tbody td::before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;font-weight:700;line-height:1.2}.table-wrap tbody td:first-child{grid-column:1/-1;display:block;padding:10px 12px;background:var(--navy);color:#fff;text-align:left;font-size:15px}.table-wrap tbody td:first-child::before{display:none}.table-wrap tbody td:not(:first-child):not(:last-child){background:#f5f8fc}.table-wrap tbody td.group-start{border-top:3px solid var(--strong)!important}.table-wrap tbody td:last-child{grid-column:1/-1;display:flex;flex-direction:row;gap:8px;padding:11px;background:#e6edf6;color:var(--navy);font-size:16px}.table-wrap tbody td:last-child::before{color:var(--navy);font-size:13px}.pct{width:76px;max-width:100%;padding:9px 4px}#preview .table-wrap tbody td{min-height:52px}
    }
  </style>
</head>
<body>
  <header><h1>HSBMA 작업 진행 현황</h1><p id="headerSub">프로젝트를 선택해줘</p></header>
  <main>
    <section id="home" class="home card"><h2>프로젝트 선택</h2><p>진행 현황을 입력할 프로젝트를 선택해줘.</p><div class="project-grid"><button class="project-btn" data-project="pkg">PKG</button><button class="project-btn" data-project="tap">TAP WELDING</button></div></section>
    <div id="appView" class="app-view"><input id="project" type="hidden" value="pkg">
    <nav class="tabs"><button class="tab active" data-tab="input">진척률 입력</button><button class="tab" data-tab="preview">공유 이미지 미리보기</button></nav>
    <section id="input" class="panel active"><div class="card">
      <div class="filters">
        <label class="field">기준일<input id="workDate" type="date"></label>
        <button id="projectChange" class="btn">프로젝트 변경</button>
      </div>
      <div class="table-wrap"><table><thead id="inputHead"></thead><tbody id="inputBody"></tbody></table></div>
      <div class="buttons"><span id="saveStatus" class="status">프로젝트·날짜별 자동 불러오기 · 입력 즉시 자동 저장</span><button id="clearBtn" class="btn danger">현재 기록 초기화</button><button id="previewBtn" class="btn primary">이미지 미리보기</button></div>
    </div></section>
    <section id="preview" class="panel"><div class="card">
      <div id="report" class="report"><div class="report-title"><h2 id="reportTitle">HSBMA PKG 작업 진행 현황</h2><span id="reportDate" class="report-date"></span></div><div id="kpis" class="kpis"></div><div class="table-wrap"><table><thead id="reportHead"></thead><tbody id="reportBody"></tbody></table></div></div>
      <p class="share-note">아이폰은 공유창에서 ‘이미지 저장’을 누르면 사진 앱에 저장돼.</p>
      <div class="buttons"><button id="backBtn" class="btn">입력 화면</button><button id="shareBtn" class="btn">카카오톡 공유</button><button id="pngBtn" class="btn primary">사진첩에 저장</button></div>
    </div></section>
    <div class="version">HSBMA Progress v1.3.2</div></div>
  </main>
  <script>
    const LINES=[5,6,7,8];
    const PROJECTS={
      pkg:{name:'PKG',groups:[{name:'본도',fields:[['be','EL'],['bp','POUCH'],['ba','ASSEMBLEY']]},{name:'미러',fields:[['me','EL'],['mp','POUCH'],['ma','ASSEMBLEY']]}]},
      tap:{name:'TAP WELDING',groups:[{name:'',fields:[['jr','JR'],['tw','TW'],['bf','BF']]}]}
    };
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const clamp=v=>Math.max(0,Math.min(100,Number(v)||0));
    const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);
    const config=()=>PROJECTS[$('#project').value];
    const fields=()=>config().groups.flatMap(g=>g.fields);
    const key=()=>$('#project').value==='pkg'?`hsbma-pkg:${$('#workDate').value}`:`hsbma-tap-welding:${$('#workDate').value}`;
    let statusTimer;

    function headHtml(){
      const c=config(), grouped=c.groups.length>1;
      if(grouped)return `<tr><th rowspan="2">라인</th>${c.groups.map((g,i)=>`<th class="group ${i?'group-start':''}" colspan="${g.fields.length}">${g.name} 진척률</th>`).join('')}<th rowspan="2" class="group-start">종합</th></tr><tr>${c.groups.map((g,gi)=>g.fields.map((f,fi)=>`<th class="${gi&&fi===0?'group-start':''}">${f[1]}</th>`).join('')).join('')}</tr>`;
      return `<tr><th>라인</th>${c.groups[0].fields.map(f=>`<th>${f[1]}</th>`).join('')}<th class="group-start">종합</th></tr>`;
    }
    function render(){
      const c=config(), fs=fields(), starts=new Set();let p=0;c.groups.forEach((g,i)=>{if(i)starts.add(p);p+=g.fields.length});
      $('#headerSub').textContent=`${c.name} · LINE 5–8`;$('#inputHead').innerHTML=headHtml();
      $('#inputBody').innerHTML=LINES.map(line=>`<tr data-line="${line}"><td>LINE ${line}</td>${fs.map((f,i)=>`<td class="${starts.has(i)?'group-start':''}" data-label="${c.groups.length>1?c.groups.find(g=>g.fields.some(x=>x[0]===f[0])).name+' · ':''}${f[1]}"><input class="pct" inputmode="decimal" type="number" min="0" max="100" step="1" data-field="${f[0]}" value="0">%</td>`).join('')}<td class="avg group-start" data-label="종합 진척률">0%</td></tr>`).join('');
      $$('.pct').forEach(i=>i.oninput=()=>{i.value=clamp(i.value);update();save()});load();
    }
    const read=()=>LINES.map(line=>{const tr=$(`#inputBody tr[data-line="${line}"]`),vals=fields().map(f=>clamp(tr.querySelector(`[data-field="${f[0]}"]`).value));return {line,vals,avg:vals.reduce((a,b)=>a+b,0)/vals.length}});
    function update(){const rows=read();rows.forEach(r=>$(`#inputBody tr[data-line="${r.line}"] .avg`).textContent=`${fmt(r.avg)}%`);return rows}
    function save(){localStorage.setItem(key(),JSON.stringify(read()));$('#saveStatus').textContent=`${config().name} · ${$('#workDate').value} 자동 저장 완료`;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#saveStatus').textContent='프로젝트·날짜별 자동 불러오기 · 입력 즉시 자동 저장',1400)}
    function load(){const raw=localStorage.getItem(key()),fs=fields(),rows=raw?JSON.parse(raw):LINES.map(line=>({line,vals:fs.map(()=>0)}));rows.forEach(r=>{const tr=$(`#inputBody tr[data-line="${r.line}"]`);if(tr)fs.forEach((f,i)=>tr.querySelector(`[data-field="${f[0]}"]`).value=clamp(r.vals[i]))});update();$('#saveStatus').textContent=raw?`${config().name} · ${$('#workDate').value} 기록 자동 불러옴`:`${config().name} · ${$('#workDate').value} 새 기록`}
    function summary(){const rows=update(),all=rows.flatMap(r=>r.vals),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;return {rows,all:avg(all),groups:config().groups.map((g,gi)=>{let start=config().groups.slice(0,gi).reduce((n,x)=>n+x.fields.length,0),vals=rows.flatMap(r=>r.vals.slice(start,start+g.fields.length));return {name:g.name,value:avg(vals)}})}}
    function buildReport(){
      const c=config(),s=summary(),fs=fields(),starts=new Set();let p=0;c.groups.forEach((g,i)=>{if(i)starts.add(p);p+=g.fields.length});
      $('#reportTitle').textContent=`HSBMA ${c.name} 작업 진행 현황`;$('#reportDate').textContent=$('#workDate').value.replaceAll('-','. ')+' 기준';$('#reportHead').innerHTML=headHtml().replaceAll(' 진척률','');
      const cards=[['전체 진척률',s.all],...s.groups.filter(g=>g.name).map(g=>[`${g.name} 평균`,g.value])];$('#kpis').style.gridTemplateColumns=`repeat(${cards.length},1fr)`;$('#kpis').innerHTML=cards.map(a=>`<div class="kpi">${a[0]}<b>${fmt(a[1])}%</b></div>`).join('');
      $('#reportBody').innerHTML=s.rows.map(r=>`<tr><td>LINE ${r.line}</td>${r.vals.map((v,i)=>`<td class="${starts.has(i)?'group-start':''}" data-label="${c.groups.length>1?c.groups.find(g=>g.fields.some(x=>x[0]===fs[i][0])).name+' · ':''}${fs[i][1]}">${fmt(v)}%</td>`).join('')}<td class="avg group-start" data-label="종합 진척률">${fmt(r.avg)}%</td></tr>`).join('');
    }
    function tab(id){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));$$('.panel').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='preview')buildReport();scrollTo({top:0,behavior:'smooth'})}
    function drawCanvas(){
      const c=config(),s=summary(),fs=fields(),W=1600,H=850,cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=W;cv.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#173b6d';x.fillRect(0,0,W,110);x.fillStyle='#fff';x.font='700 38px Arial';x.fillText(`HSBMA ${c.name} 작업 진행 현황`,55,66);x.font='22px Arial';x.fillText($('#workDate').value.replaceAll('-','. ')+' 기준',1290,66);
      const cards=[['전체 진척률',s.all],...s.groups.filter(g=>g.name).map(g=>[`${g.name} 평균`,g.value])],gap=22,cardW=(1490-gap*(cards.length-1))/cards.length;cards.forEach((a,i)=>{const bx=55+i*(cardW+gap);x.fillStyle='#eaf0f7';x.fillRect(bx,140,cardW,110);x.fillStyle='#667085';x.font='22px Arial';x.textAlign='center';x.fillText(a[0],bx+cardW/2,178);x.fillStyle='#173b6d';x.font='700 38px Arial';x.fillText(fmt(a[1])+'%',bx+cardW/2,226)});
      const left=55,top=290,rowH=90,lineW=190,avgW=190,dataW=(1490-lineW-avgW)/fs.length,col=[lineW,...fs.map(()=>dataW),avgW],headers=['LINE',...fs.map(f=>f[1]),'종합'],total=col.reduce((a,b)=>a+b,0);x.fillStyle='#eaf0f7';x.fillRect(left,top,total,100);let pos=left;x.textAlign='center';headers.forEach((h,i)=>{x.fillStyle='#172033';x.font='700 20px Arial';x.fillText(h,pos+col[i]/2,top+60);pos+=col[i]});s.rows.forEach((r,ri)=>{let px=left,y=top+100+ri*rowH;x.fillStyle=ri%2?'#f7f9fc':'#fff';x.fillRect(left,y,total,rowH);const vals=[`LINE ${r.line}`,...r.vals.map(v=>fmt(v)+'%'),fmt(r.avg)+'%'];vals.forEach((v,i)=>{x.fillStyle=i===vals.length-1?'#173b6d':'#172033';x.font=(i===0||i===vals.length-1?'700 ':'')+'22px Arial';x.fillText(v,px+col[i]/2,y+54);px+=col[i]})});x.strokeStyle='#c8d0dc';x.lineWidth=2;for(let i=0;i<=4;i++){x.beginPath();x.moveTo(left,top+100+i*rowH);x.lineTo(left+total,top+100+i*rowH);x.stroke()}pos=left;for(let i=0;i<=col.length;i++){x.strokeStyle=(i===1||i===col.length-1)?'#6f7d91':'#c8d0dc';x.lineWidth=(i===1||i===col.length-1)?5:2;x.beginPath();x.moveTo(pos,top);x.lineTo(pos,top+100+4*rowH);x.stroke();if(i<col.length)pos+=col[i]}x.textAlign='left';return cv
    }
    async function pngBlob(){return await new Promise(ok=>drawCanvas().toBlob(ok,'image/png',1))}
    function downloadPng(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`HSBMA_${config().name.replaceAll(' ','_')}_${$('#workDate').value}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
    async function nativeShare(){const blob=await pngBlob(),file=new File([blob],`HSBMA_${config().name.replaceAll(' ','_')}_${$('#workDate').value}.png`,{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({title:`HSBMA ${config().name} 작업 진행 현황`,files:[file]})}catch(e){if(e.name!=='AbortError')downloadPng(blob)}}else{downloadPng(blob);alert('공유 기능을 지원하지 않아 PNG 파일로 저장했어.')}}
    $('#workDate').value=today();$$('.project-btn').forEach(b=>b.onclick=()=>{$('#project').value=b.dataset.project;$('#home').style.display='none';$('#appView').style.display='block';tab('input');render()});$('#projectChange').onclick=()=>{$('#appView').style.display='none';$('#home').style.display='block';$('#headerSub').textContent='프로젝트를 선택해줘';scrollTo({top:0,behavior:'smooth'})};$('#workDate').onchange=load;$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#previewBtn').onclick=()=>{save();tab('preview')};$('#backBtn').onclick=()=>tab('input');$('#clearBtn').onclick=()=>{if(confirm(`${config().name} · ${$('#workDate').value} 입력값을 모두 0%로 초기화할까?`)){localStorage.removeItem(key());load()}};$('#pngBtn').onclick=nativeShare;$('#shareBtn').onclick=nativeShare;
  </script>
</body>
</html>
